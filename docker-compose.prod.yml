services:
  mongodb:
    image: mongo:7
    container_name: orbit-mongodb
    restart: always
    ports:
      - "27017:27017" # Exposed to host for backup/management, restrict in firewall
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: orbit

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: always
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: orbit-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbit-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: ./backend
    container_name: orbit-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/orbit
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_EXPIRE: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_CLIENT_ID: orbit-api
      KAFKA_BROKERS: kafka:9092
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 1000
      CORS_ORIGIN: http://localhost:3000,http://${DOMAIN_NAME:-localhost}
    depends_on:
      - mongodb
      - redis
      - kafka

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: orbit-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
