version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: orbit-mongodb
    ports:
      - "21011:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: orbit

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: orbit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: orbit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: ./backend
    container_name: orbit-backend
    ports:
      - "5000:5000"
    environment:
      # Application
      NODE_ENV: development
      PORT: 5000

      # Database
      MONGODB_URI: mongodb://mongodb:27017/orbit

      # Authentication
      JWT_SECRET: 2q+nntjQ+VYXmMoBb878mkXlSZ4dG62Dx/LM6yDmNfs=
      JWT_EXPIRE: 7d

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Kafka
      KAFKA_CLIENT_ID: orbit-api
      KAFKA_BROKERS: kafka:9092

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100

      # CORS
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
    depends_on:
      - mongodb
      - redis
      - kafka
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: orbit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
